<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>Limit Desk</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<main>
<header><a href="/" class="brand">Limit Desk<span class="brand-dot">.</span></a><button id="refresh" aria-label="利用枠を更新"><span>更新</span><svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true"><path d="M13 6A5.2 5.2 0 1 0 13 10M13 2v4H9" stroke="currentColor" stroke-width="1.3"/></svg></button></header>
<section id="cards" class="cards" aria-label="CLIの残り利用枠と時間" aria-live="polite"></section>

</main>
